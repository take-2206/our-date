<!doctype html>
<!--
  LoveSync modular structure:
  - css/styles.css contains shared theme and component styles.
  - js/core.js contains configuration, translations, state, and helpers.
  - js/pages/ contains independent page renderers.
  - js/data.js handles Supabase; js/interactions.js handles DOM events.
  Configure SB_URL and SB_KEY in js/core.js.
-->
<html lang="vi">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
    <meta name="theme-color" content="#0d0d0d" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="LoveSync" />
    <title>LoveSync</title>
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="apple-touch-icon" sizes="180x180" href="./img/icons/app-icon-180.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="./img/icons/app-icon-192.png" />
    <!-- Thư viện Supabase (đăng nhập, database, realtime), đặt cùng thư mục với index.html -->
    <script src="./supabase.js"></script>
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@500;700&family=Nunito:wght@600;700;800&family=Silkscreen&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./css/styles.css" />
  </head>
  <body>
    <!-- Bộ biểu tượng SVG dùng lại bằng <use>: hr = trái tim pixel, st = ngôi sao, ch = chibi nữ, bo = chibi nam -->
    <svg width="0" height="0" style="position: absolute" aria-hidden="true">
      <symbol id="hr" viewBox="0 0 10 8" shape-rendering="crispEdges">
        <path fill="#FF69B4" d="M1 1H4V2H6V1H9V4H8V5H7V6H6V7H4V6H3V5H2V4H1Z" />
      </symbol>
      <symbol id="st" viewBox="0 0 24 24">
        <path fill="#FFB6D9" d="M12 0C13 8 16 11 24 12C16 13 13 16 12 24C11 16 8 13 0 12C8 11 11 8 12 0Z" />
      </symbol>
      <symbol id="ch" viewBox="0 0 120 120">
        <path d="M30 34L22 14L44 26ZM90 34L98 14L76 26Z" fill="#FF69B4" />
        <circle cx="60" cy="64" r="44" fill="#FF69B4" />
        <circle cx="60" cy="68" r="36" fill="#FFE8F1" />
        <path
          d="M22 62C24 30 50 18 66 22C86 26 98 42 98 62C88 50 72 44 56 40C44 48 30 54 22 62Z"
          fill="#FF69B4"
        />
        <ellipse cx="45" cy="72" rx="6" ry="8" fill="#0D0D0D" />
        <ellipse cx="75" cy="72" rx="6" ry="8" fill="#0D0D0D" />
        <circle cx="47" cy="69" r="2.4" fill="#fff" />
        <circle cx="77" cy="69" r="2.4" fill="#fff" />
        <ellipse cx="36" cy="83" rx="6" ry="3.5" fill="#FF8DC7" opacity=".7" />
        <ellipse cx="84" cy="83" rx="6" ry="3.5" fill="#FF8DC7" opacity=".7" />
        <path d="M54 86Q60 91 66 86" stroke="#0D0D0D" stroke-width="2.4" fill="none" stroke-linecap="round" />
      </symbol>
      <symbol id="bo" viewBox="0 0 120 120">
        <rect width="120" height="120" fill="#FFF3F8" />
        <path d="M14 120C16 98 38 94 60 94C82 94 104 98 106 120Z" fill="#FF69B4" />
        <circle cx="60" cy="64" r="34" fill="#FFE0CC" />
        <ellipse cx="46" cy="68" rx="5" ry="7" fill="#0D0D0D" />
        <ellipse cx="74" cy="68" rx="5" ry="7" fill="#0D0D0D" />
        <circle cx="47.5" cy="65.5" r="2" fill="#fff" />
        <circle cx="75.5" cy="65.5" r="2" fill="#fff" />
        <ellipse cx="38" cy="80" rx="5" ry="3" fill="#FF8DC7" opacity=".7" />
        <ellipse cx="82" cy="80" rx="5" ry="3" fill="#FF8DC7" opacity=".7" />
        <path d="M53 82Q60 88 67 82" stroke="#0D0D0D" stroke-width="2.4" fill="none" stroke-linecap="round" />
        <path
          d="M24 62C20 28 46 14 64 18C90 22 100 44 96 62C92 50 86 42 76 40C62 48 40 46 28 54Z"
          fill="#4A3340"
        />
        <path d="M26 62L30 76L36 60Z M94 62L90 76L84 60Z" fill="#4A3340" />
      </symbol>
    </svg>
    <!-- #app: nơi vẽ các màn hình (đăng nhập, lịch, chi tiết, cài đặt). #lt: lớp phủ lá thư -->
    <div id="app"></div>
    <div id="lt"></div>
    <script src="./js/core.js"></script>
    <script src="./js/pages/auth.js"></script>
    <script src="./js/pages/calendar.js"></script>
    <script src="./js/pages/details.js"></script>
    <script src="./js/pages/notes.js"></script>
    <script src="./js/pages/trash.js"></script>
    <script src="./js/pages/settings.js"></script>
    <script src="./js/pages/album.js"></script>
    <script src="./js/render.js"></script>
    <script src="./js/letter.js"></script>
    <script src="./js/actions.js"></script>
    <script src="./js/interactions.js"></script>
    <script src="./js/data.js"></script>
    <script src="./js/push.js"></script>
    <script src="./js/app.js"></script>
  </body>
</html>
